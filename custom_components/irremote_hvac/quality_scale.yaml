rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom service actions.
  appropriate-polling:
    status: exempt
    comment: Integration is local push/assumed state and does not poll the HVAC device.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register custom service actions.
  docs-conditions:
    status: exempt
    comment: Integration does not provide custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not provide custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Integration uses local IR emitters and has no credentials to refresh.
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: exempt
    comment: Integration stores only local configuration and no runtime diagnostics data useful to download.
  discovery:
    status: exempt
    comment: IR-controlled HVAC devices cannot be discovered automatically.
  discovery-update-info:
    status: exempt
    comment: Integration has no discovery flow.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One configured entry represents one IR-controlled HVAC device.
  entity-category:
    status: exempt
    comment: Integration does not create diagnostic or configuration entities.
  entity-device-class:
    status: exempt
    comment: Climate and switch entities do not use device classes.
  entity-disabled-by-default:
    status: exempt
    comment: Integration exposes only primary user-facing entities.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: Integration does not define custom icons.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Integration does not dynamically discover devices that can become stale.

  # Platinum
  async-dependency:
    status: exempt
    comment: pyhvac performs local in-memory IR payload generation and is run without network I/O.
  inject-websession:
    status: exempt
    comment: Integration does not use HTTP sessions.
  strict-typing: done
